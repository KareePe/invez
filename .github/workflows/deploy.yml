name: Invez Deploy

on:
  push:
    branches:
      - main
      - uat

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create .env from secrets
        # Quoted heredoc delimiter: GitHub substitutes ${{ secrets.* }} before the
        # shell runs, so quoting stops a $ or backtick inside a secret from being
        # expanded away when the file is written.
        run: |
          cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_CHARSET=utf8mb4

          # Production domain. Reset-password links in outgoing mail are built from
          # this, never from the Host header, so it must match the live site exactly.
          APP_URL=https://invez.biz

          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=465
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS="${{ secrets.SMTP_PASS }}"
          SMTP_FROM_NAME=INVEZ
          EOF

      - name: Deploy Production via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /httpdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/database/**
            **/.env.example
            **/CLAUDE.md
            **/.github/**

  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create .env from secrets
        # See the production job for why the heredoc delimiter is quoted.
        run: |
          cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_UAT_HOST }}
          DB_NAME=${{ secrets.DB_UAT_NAME }}
          DB_USER=${{ secrets.DB_UAT_USER }}
          DB_PASS=${{ secrets.DB_UAT_PASS }}
          DB_CHARSET=utf8mb4

          # UAT domain — the one difference from production. A reset link built with
          # the production URL would point at a site whose database has no such token.
          APP_URL=https://uat.invez.biz

          SMTP_HOST=${{ secrets.SMTP_HOST_UAT }}
          SMTP_PORT=465
          SMTP_USER=${{ secrets.SMTP_USER_UAT }}
          SMTP_PASS="${{ secrets.SMTP_PASS_UAT }}"
          SMTP_FROM_NAME=INVEZ
          EOF

      - name: Deploy UAT via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /uat.invez.biz/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/database/**
            **/.env.example
            **/CLAUDE.md
            **/.github/**